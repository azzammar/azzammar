<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Folder untuk UI Frontend (React statis/HTML jika ada nanti)
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Routing Utama: Memetakan http://localhost/api/ ke folder binary Qt/C++
    ScriptAlias /api/ "/usr/lib/cgi-bin/azzammar/"
    
    <Directory "/usr/lib/cgi-bin/azzammar">
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require all granted

        # Tambahkan 3 baris CORS Headers ini agar bisa diakses oleh React di browser
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "POST, GET, OPTIONS, DELETE, PUT"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization"
        
        # Mengizinkan berkas binary tanpa ekstensi untuk dieksekusi sebagai CGI
        <FilesMatch "^[^.]+$">
            SetHandler cgi-script
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

