port=0
interface=enp1s0f0
bind-interfaces

dhcp-range=192.168.10.50,192.168.10.200,255.255.255.0,12h

dhcp-match=set:efi,93,7
dhcp-match=set:efi,93,9
dhcp-match=set:efi,93,11

dhcp-boot=tag:efi,snponly.efi,,192.168.10.10
dhcp-boot=tag:!efi,undionly.kpxe,,192.168.10.10

enable-tftp
tftp-root=/var/www/html/pxe
